services:
  - type: web
    name: disaster-intel-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PYTHONPATH
        value: .
      - key: DIGEST_GENERATION_ENABLED
        value: "false"
