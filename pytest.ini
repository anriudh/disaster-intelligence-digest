[pytest]
testpaths = backend/tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    network: needs live internet access (deselected by default)
    model: needs the ML stack (spaCy, KeyBERT, sentence-transformers, xgboost, shap) and committed model artifacts (deselected by default)
addopts = -m "not network and not model"
